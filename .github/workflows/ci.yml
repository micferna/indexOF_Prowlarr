name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Les CVE apparaissent après le merge : on re-scanne les images chaque semaine
  # même sans commit.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Droits minimaux par défaut ; chaque job élargit si nécessaire.
permissions:
  contents: read

# Une exécution utile par branche : les runs dépassés sont annulés.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · PHPStan · Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version embarquée dans l'image, et la suivante : une montée de version
        # ne doit pas se découvrir en production.
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl
          tools: composer
          coverage: none

      - name: Cohérence de composer.json / composer.lock
        run: composer validate --strict

      - name: Lint PHP
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Lint JavaScript
        run: for f in public/assets/*.js; do node --check "$f"; done

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit des dépendances (CVE)
        run: composer audit --no-interaction

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: PHPUnit
        run: vendor/bin/phpunit

  docker:
    name: Build · CVE images · Secrets · IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # remontée SARIF dans l'onglet Security
    steps:
      - uses: actions/checkout@v7

      - name: Prepare env
        run: cp exemple.env .env

      - name: Build images
        run: docker compose build

      - name: Trivy — CVE image php (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: indexof-prowlarr-php:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy — CVE image web (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: indexof-prowlarr-web:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Secrets commités et mauvaises configurations (Dockerfile, compose, CI).
      - name: Trivy — secrets et configuration (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: data,vendor

      # Vue complète (toutes sévérités) publiée dans l'onglet Security, sans bloquer.
      - name: Trivy — rapport SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          skip-dirs: data,vendor

      - name: Publier le rapport dans Security
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy

  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: javascript
          queries: security-and-quality

      - name: Analyser
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: codeql-javascript
