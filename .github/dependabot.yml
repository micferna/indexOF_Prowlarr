version: 2

# Mises à jour automatiques : les CVE se corrigent surtout en suivant les
# versions. Un scan qui alerte sans PR de correction ne sert à rien.
updates:
  # Dépendances PHP (outils de dev : PHPStan, PHPUnit).
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Images de base du Dockerfile (php:8.3-fpm-alpine, nginx:1.27-alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Actions utilisées par la CI (épinglées : Dependabot les fait monter).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
