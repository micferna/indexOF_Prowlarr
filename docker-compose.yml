services:
  php:
    build:
      context: .
      target: php
    image: indexof-prowlarr-php:latest
    container_name: indexof_php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CACHE_DIR: /tmp/indexof_cache
      # Mettre à 1 UNIQUEMENT si nginx est derrière un reverse-proxy de confiance
      # qui pose X-Forwarded-For (sinon l'en-tête est usurpable).
      TRUST_PROXY: "0"
    depends_on:
      - prowlarr
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Racine en lecture seule : le code livré ne peut pas être modifié depuis le
    # conteneur (seul /tmp — cache + sessions, en RAM — est inscriptible).
    read_only: true
    tmpfs:
      - /tmp
    # Les sessions survivent au redéploiement : sans ce volume elles vivent en
    # tmpfs et chaque `up -d php` déconnecte tous les utilisateurs.
    volumes:
      - php-sessions:/var/lib/php/sessions
      # Historique d'envois et recherches enregistrées : une base SQLite, donc
      # un volume. Sans lui, ces fonctionnalités se désactivent d'elles-mêmes.
      - php-data:/var/lib/indexof
      # Bibliothèque : ce que qBittorrent a terminé. EN LECTURE SEULE — l'app
      # liste et donne à lire, elle n'a aucune raison de pouvoir effacer un
      # film. Sans ce montage, la vue Bibliothèque se désactive d'elle-même.
      - ${DOWNLOADS_DIR:-./data/downloads}:/media:ro
      # Espace de travail des conversions HLS. Le SEUL endroit inscriptible en
      # dehors du cache : les segments d'un film ne tiennent pas en RAM, et le
      # dossier de médias reste en lecture seule. À placer sur un disque avec de
      # l'espace — comptez la taille du film par lecture en cours.
      - ${TRANSCODE_DIR:-./data/transcode}:/transcode

  web:
    build:
      context: .
      target: web
    image: indexof-prowlarr-web:latest
    container_name: indexof_web
    restart: unless-stopped
    # Par défaut la loopback seule : exposez via un reverse-proxy TLS.
    #
    # Le Cast fait exception : le téléviseur vient chercher la vidéo lui-même, et
    # « localhost » ne désigne rien pour lui. Dans ce cas seulement, posez
    # BIND_ADDR sur l'adresse de la machine dans le réseau local — jamais 0.0.0.0.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:80"
    depends_on:
      - php
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    read_only: true
    volumes:
      # Les vidéos sont servies par nginx, pas par PHP : un film de 20 Go passant
      # par php-fpm mobiliserait un worker pendant toute la lecture, et les
      # requêtes Range du navigateur seraient à réimplémenter. PHP se contente
      # d'autoriser, nginx envoie (X-Accel-Redirect). Lecture seule, et le
      # dossier n'est atteignable que par une redirection interne.
      - ${DOWNLOADS_DIR:-./data/downloads}:/media:ro
      # Segments HLS : c'est nginx qui les sert, PHP ne fait que les produire.
      - ${TRANSCODE_DIR:-./data/transcode}:/transcode:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  # Découverte des récepteurs Cast (MiBox, Chromecast, Android TV).
  #
  # SEUL service en réseau hôte, et c'est la raison d'être de sa séparation : le
  # multicast mDNS ne traverse pas le bridge Docker, donc le conteneur applicatif
  # n'entendrait aucune annonce. Ce service écoute, écrit une liste dans le
  # volume partagé, et c'est tout : aucun port ouvert, aucune API, l'application
  # ne lui parle jamais.
  #
  # Derrière un profil : rien ne démarre sans le demander explicitement.
  #   docker compose --profile cast up -d
  cast:
    build:
      context: .
      target: php
    image: indexof-prowlarr-php:latest
    container_name: indexof_cast
    profiles: ["cast"]
    restart: unless-stopped
    command: ["php", "/var/www/html/bin/cast-discover.php"]
    environment:
      DATA_DIR: /var/lib/indexof
      CAST_SCAN_INTERVAL: "60"
    # Indispensable : c'est ce qui donne accès au multicast du réseau local.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - php-data:/var/lib/indexof

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: indexof_prowlarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./data/prowlarr:/config
    # Panel admin : loopback uniquement (plus d'exposition réseau publique).
    ports:
      - "127.0.0.1:9696:9696"
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: indexof_qbittorrent
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
      # Port interne = port publié : qBittorrent valide l'en-tête Host (port
      # compris), une redirection de port casserait l'accès à la WebUI.
      WEBUI_PORT: "8081"
    volumes:
      - ./data/qbittorrent:/config
      # qBittorrent enregistre dans /downloads : sans ce montage, les fichiers
      # restent dans la couche du conteneur et disparaissent à sa recréation.
      # Le chemin doit être identique côté Sonarr/Radarr pour qu'ils retrouvent
      # les téléchargements terminés.
      - ${DOWNLOADS_DIR:-./data/downloads}:/downloads
    # WebUI : loopback uniquement, authentification obligatoire (mot de passe
    # PBKDF2 posé dans data/qbittorrent/.../qBittorrent.conf, bypass sous-réseau
    # et localhost désactivés, CSRF + validation d'en-tête Host actives).
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true

  # ------------------------------------------------------------------
  # Notifications Discord des recherches enregistrées — optionnel.
  #   docker compose --profile notify up -d
  # Renseignez DISCORD_WEBHOOK dans .env et activez la cloche sur les
  # recherches à surveiller. Sans webhook, le service ne fait rien.
  # ------------------------------------------------------------------
  notifier:
    image: indexof-prowlarr-php:latest
    container_name: indexof_notifier
    profiles: ["notify"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CACHE_DIR: /tmp/indexof_cache
    # Une boucle plutôt qu'un démon cron : un processus, des journaux qui
    # arrivent dans `docker compose logs`, rien de plus à installer.
    entrypoint: ["sh", "-c"]
    command:
      - 'while true; do php /var/www/html/bin/notify.php; sleep "${NOTIFY_INTERVAL:-900}"; done'
    depends_on:
      - prowlarr
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - php-data:/var/lib/indexof

  # ------------------------------------------------------------------
  # Applications *arr — optionnelles, derrière un profil : rien ne démarre
  # sans `docker compose --profile arr up -d`.
  #
  # Une fois lancées : récupérez leur clé API (Settings > General), mettez-la
  # dans .env (SONARR_URL/SONARR_API_KEY…), et le bouton d'envoi apparaît sur
  # chaque résultat. Dans Prowlarr, ajoutez-les en « Apps » pour qu'il y
  # synchronise vos indexeurs.
  # ------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: indexof_sonarr
    profiles: ["arr"]
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./data/sonarr:/config
      - ${DOWNLOADS_DIR:-./data/downloads}:/downloads
    ports:
      - "127.0.0.1:8989:8989"
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: indexof_radarr
    profiles: ["arr"]
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./data/radarr:/config
      - ${DOWNLOADS_DIR:-./data/downloads}:/downloads
    ports:
      - "127.0.0.1:7878:7878"
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true

volumes:
  php-sessions:
  php-data:

networks:
  indexof:
    driver: bridge
