services:
  php:
    build:
      context: .
      target: php
    image: indexof-prowlarr-php:latest
    container_name: indexof_php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CACHE_DIR: /tmp/indexof_cache
      # Mettre à 1 UNIQUEMENT si nginx est derrière un reverse-proxy de confiance
      # qui pose X-Forwarded-For (sinon l'en-tête est usurpable).
      TRUST_PROXY: "0"
    depends_on:
      - prowlarr
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  web:
    build:
      context: .
      target: web
    image: indexof-prowlarr-web:latest
    container_name: indexof_web
    restart: unless-stopped
    # N'écoute QUE sur la loopback : un reverse-proxy TLS (sur cet hôte) expose le
    # service en HTTPS. Si votre reverse-proxy est sur une autre machine, adaptez.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - php
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: indexof_prowlarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./data/prowlarr:/config
    # Panel admin : loopback uniquement (plus d'exposition réseau publique).
    ports:
      - "127.0.0.1:9696:9696"
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: indexof_qbittorrent
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
      WEBUI_PORT: "8080"
    volumes:
      - ./data/qbittorrent:/config
    # WebUI : loopback uniquement. Dans qBittorrent (Settings > Web UI) : définir
    # un mot de passe fort, activer CSRF + Host-header validation, désactiver le
    # bypass d'authentification par sous-réseau local.
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - indexof
    security_opt:
      - no-new-privileges:true

networks:
  indexof:
    driver: bridge
