# Rate-limiting basé sur l'IP cliente. IMPORTANT : derrière un reverse-proxy,
# activez le module realip (set_real_ip_from <ip_du_proxy>; real_ip_header
# X-Forwarded-For;) pour limiter sur la vraie IP du client et non celle du proxy.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 4m;

    # À activer une fois derrière TLS (le reverse-proxy TLS doit aussi poser HSTS) :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # En-têtes de sécurité sur les fichiers statiques (les réponses PHP posent
    # déjà leur propre CSP + en-têtes).
    location ~* \.(?:js|css|map|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Tout ce qui n'est pas un fichier existant est routé vers index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Login : limitation forte (anti-brute-force).
    location = /login.php {
        limit_req zone=login burst=3 nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # Exécution PHP via php-fpm (service "php" du compose).
    location ~ \.php$ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # Refuse l'accès aux fichiers cachés (.env, .git, etc.).
    location ~ /\. {
        deny all;
    }
}
