# Rate-limiting basé sur l'IP cliente. IMPORTANT : derrière un reverse-proxy,
# activez le module realip (set_real_ip_from <ip_du_proxy>; real_ip_header
# X-Forwarded-For;) pour limiter sur la vraie IP du client et non celle du proxy.
# Le quota de login ne doit compter que les tentatives réelles (POST sur
# /login.php) : sinon un simple rechargement de la page de connexion consomme le
# quota et renvoie 503 à un utilisateur légitime. Clé vide = non comptabilisé.
# On teste $uri (chemin normalisé, sans query string) : pas de contournement via
# /login.php?x=1.
map "$request_method:$uri" $login_key {
    default                "";
    ~^POST:/login\.php$    $binary_remote_addr;
}

# Les affiches sont comptées à part. Une page de résultats en demande vingt-cinq
# d'un coup : sur le quota général (60 r/min), le premier écran suffirait à le
# vider et les images repartiraient en 503. Elles restent limitées — mais à leur
# propre cadence, et sans consommer le quota de l'API.
# Même raisonnement pour la lecture vidéo : chaque déplacement dans un film est
# une nouvelle requête (Range), et un lecteur en fait beaucoup.
map $uri $api_key {
    default                          $binary_remote_addr;
    ~^/(?:poster|stream)\.php$       "";
}
map $uri $poster_key {
    default                          "";
    ~^/poster\.php$                  $binary_remote_addr;
}
map $uri $stream_key {
    default                          "";
    ~^/stream\.php$                  $binary_remote_addr;
}

limit_req_zone $login_key  zone=login:10m   rate=5r/m;
limit_req_zone $api_key    zone=api:10m     rate=60r/m;
limit_req_zone $poster_key zone=posters:10m rate=300r/m;
limit_req_zone $stream_key zone=stream:10m  rate=600r/m;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 4m;

    # À activer une fois derrière TLS (le reverse-proxy TLS doit aussi poser HSTS) :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # En-têtes de sécurité sur les fichiers statiques (les réponses PHP posent
    # déjà leur propre CSP + en-têtes).
    location ~* \.(?:js|css|map|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Un service worker mis en cache 24 h ne se met jamais à jour.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Lecture des vidéos de la bibliothèque. `internal` : cet emplacement n'est
    # PAS atteignable depuis l'extérieur — seul un X-Accel-Redirect émis par
    # stream.php, après validation du jeton, peut y mener. nginx gère alors les
    # requêtes Range nativement, ce qui permet d'avancer dans un film sans
    # mobiliser un worker php-fpm pendant toute la lecture.
    location /media-interne/ {
        internal;
        alias /media/;
    }

    # La lecture vidéo a ses propres règles : une conversion à la volée dure
    # aussi longtemps que le film, et son flux ne doit pas être accumulé avant
    # d'être servi — sinon la lecture ne démarre qu'à la fin de la conversion.
    location = /stream.php {
        limit_req zone=stream burst=120 nodelay;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/stream.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
        # Le défaut (60 s) coupait toute conversion dépassant une minute.
        fastcgi_read_timeout 12h;
        fastcgi_buffering off;
        gzip off;
    }

    # Segments HLS produits par la conversion. Servis directement par nginx :
    # PHP les fabrique, il n'a pas à les relayer.
    #
    # Pas d'authentification ici, et c'est délibéré : le récepteur Cast n'a pas
    # de session. Le nom de dossier fait office de capacité — 128 bits dérivés du
    # secret applicatif, donc indevinable — exactement comme le jeton de lecture.
    # Les sessions sont effacées au bout de six heures.
    location /hls/ {
        alias /transcode/;
        autoindex off;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        default_type application/octet-stream;
        # La liste grandit pendant la conversion : la mettre en cache la figerait.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        # CORS — indispensable, et c'est ce qui manquait. Un récepteur Cast lit
        # un MP4 progressif via <video src> (pas de contrôle d'origine), mais le
        # HLS via XHR/MSE : sans ces en-têtes la requête échoue en silence, et
        # l'appareil redemande la liste en boucle sans jamais charger un segment.
        # L'ouverture ne porte que sur cet emplacement, dont le nom de dossier
        # est déjà la clé d'accès.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri =404;
    }

    # Tout ce qui n'est pas un fichier existant est routé vers index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Exécution PHP via php-fpm (service "php" du compose). Les trois quotas
    # s'appliquent, chacun sur sa clé : « api » à toutes les requêtes PHP sauf
    # les affiches, « posters » aux seules affiches, « login » aux seuls POST de
    # connexion. Une clé vide rend la zone inerte pour la requête en cours.
    location ~ \.php$ {
        limit_req zone=api     burst=20  nodelay;
        limit_req zone=posters burst=60  nodelay;
        limit_req zone=stream  burst=120 nodelay;
        limit_req zone=login   burst=3   nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Refuse l'accès aux fichiers cachés (.env, .git, etc.).
    location ~ /\. {
        deny all;
    }
}
